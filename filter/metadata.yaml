type: filter
github_project: open-telemetry/opentelemetry-collector

status:
  disable_codecov_badge: true
  class: pkg

exported_configs:
  config:
    description: Config configures the matching behavior of a Filter.
    type: object
    go_struct:
      custom_validator:
        name: validateConfig
    properties:
      strict:
        description: Filter using a literal string.
        type: string
      regexp:
        description: Filter using a Go regex.
        type: string
      pattern:
        description: >-
          Filter using a simple wildcard pattern. Accepted wildcard characters are `?` (single character wildcard) and `*` (n-character wildcard).
          All other regex characters (such as `.`, common in OpenTelemetry metric names) are treated as literals when using this pattern.
        type: string
